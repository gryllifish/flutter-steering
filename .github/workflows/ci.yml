# Validates the plugin on every push and PR: manifests are valid JSON,
# shell scripts pass shellcheck, and the hook test suite passes.
# Actions are pinned to commit SHAs (tag in the comment).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2

      - name: Manifests are valid JSON
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json .mcp.json hooks/hooks.json; do
            jq empty "$f"
          done

      - name: Every skill and agent has name and description
        run: |
          for f in skills/*/SKILL.md agents/*.md; do
            grep -q '^name: ' "$f" && grep -q '^description: ' "$f" || { echo "missing frontmatter: $f"; exit 1; }
          done

      - name: Shellcheck
        run: shellcheck --severity=warning -e SC1090,SC1091 hooks/scripts/*.sh skills/*/scripts/*.sh tests/*.sh

      - name: Dart scripts are formatted and analyzed
        run: |
          dart format --output=none --set-exit-if-changed skills
          dart analyze --fatal-infos skills

      # Agent Skills spec validation, as the Flutter team does for its own
      # skills. Claude Code-specific frontmatter (argument-hint,
      # disable-model-invocation) is intentional, so disallowed-field is off.
      - name: Skills lint
        run: |
          dart pub global activate skills_lint 0.5.3+1
          dart pub global run skills_lint --skills-directory skills \
            --check-relative-paths --check-trailing-whitespace --no-disallowed-field

      - name: Script tests
        run: for t in tests/*_test.sh; do "$t" || exit 1; done
